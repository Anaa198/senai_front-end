<div class="table-responsive small">
<table class="table table-striped table-sm">
  <thead>
    <tr>
      <th scope="col">Mês</th>
      <th scope="col">Total de vendas</th>
    </tr>
  </thead>
  <tbody>
    {% for venda in vendas %}
    <tr>
      <td>{{venda["mes"]}}</td>
      <td>R$ {{locale.currency(venda["total"], grouping=True, symbol=None)}}</td>
    </tr>
     {% endfor %}
  </tbody>
</table>
</div>
